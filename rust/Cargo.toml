[package]
name = "harness-lens-lsp"
description = "Language Server Protocol adapter for Harness Lens diagnostics"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Cristian Camargo Filho <ccf@cdone.com.br>"]
license = "MPL-2.0"
repository = "https://github.com/harness-lens/language-server"
homepage = "https://github.com/harness-lens/language-server"
readme = "README.md"
keywords = ["harness", "lsp", "diagnostics", "agents"]
publish = true

[dependencies]
harness-lens = { version = "0.0.1", git = "https://github.com/harness-lens/sdk.git", rev = "6841527cc29b4c9122af391c034474d61d23d7b8" }
tokio = { version = "1.47.1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
