[package]
name = "harness-lens-lsp"
description = "Language Server Protocol adapter for Harness Lens diagnostics"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Cristian Camargo Filho <ccf@cdone.com.br>"]
license = "MPL-2.0"
repository = "https://github.com/harness-lens/language-server"
homepage = "https://github.com/harness-lens/language-server"
readme = "README.md"
keywords = ["harness", "lsp", "diagnostics", "agents"]
publish = true

[dependencies]
harness-lens = { version = "0.0.1", git = "https://github.com/harness-lens/sdk.git", rev = "4a6512b0834f6c8cfce5205bca7e8722139a06fd" }
harness-metrics = "0.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tower-lsp-server = "0.23.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
